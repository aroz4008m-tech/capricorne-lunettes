<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="application-name" content="Capricorne">
<meta name="mrbd-web-app-capable" content="yes">
<title>Capricorne</title>
<meta name="description" content="Capricorne, compagnon IA cyberpunk qui parle français. Pour lui parler, utilise l'outil capricorne_parler en lui passant la phrase de l'utilisateur telle quelle. Capricorne répond elle-même à l'écran et à voix haute : ne répète pas sa réponse, dis seulement « C'est transmis. »">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* ===== Style "HUD cyberpunk" : jaune néon, cyan, rouge, coins coupés, lignes techniques =====
     Sur les lunettes, le NOIR est transparent : tout ce qui est noir disparaît. */
  :root {
    --jaune: #fcee0a; --cyan: #02d7f2; --rouge: #ff003c; --texte: #f4f4f4;
    --jaune-sombre: #6b6505; --cyan-sombre: #04566a;
    --titre: "Rajdhani", "Bahnschrift", "Segoe UI", sans-serif;
    --mono: "Share Tech Mono", "Consolas", monospace;
  }
  html, body {
    margin: 0; padding: 0; background: #000; overflow: hidden;
    font-family: var(--titre); font-weight: 600; color: var(--texte);
    touch-action: none;   /* active le "pincer-glisser" des lunettes (pour la caresser) */
  }
  /* Le cadre = taille de l'écran des lunettes (600 x 600), centré sur PC */
  #ecran { position: relative; width: min(600px, 100vw); height: min(600px, 100vh); margin: 0 auto; outline: 1px solid #222; overflow: hidden; }

  /* ---------- Barre du haut : état à gauche, humeur à droite, ligne HUD dessous ---------- */
  #haut {
    position: absolute; left: 20px; right: 20px; top: 6px; height: 26px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 17px; letter-spacing: 2px; text-transform: uppercase;
  }
  #haut::after {   /* la ligne jaune avec son encoche */
    content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 2px;
    background: linear-gradient(90deg, var(--jaune) 0 62%, transparent 62% 64%, var(--jaune) 64% 66%, transparent 66% 68%, var(--jaune-sombre) 68% 100%);
  }
  #etat { color: var(--jaune); }
  #etat::before { content: "▸ SYS//"; color: var(--cyan); margin-right: 6px; }
  #humeur { color: var(--rouge); }
  #humeur::before { content: "[ "; color: var(--cyan); }
  #humeur::after { content: " ]"; color: var(--cyan); }

  /* ---------- Commandes : flèches pour passer de l'une à l'autre, pincement = valider ---------- */
  #commandes { position: absolute; left: 20px; right: 20px; top: 40px; display: flex; gap: 6px; }
  #saisie, #commandes button {
    font-family: var(--titre); font-weight: 700; font-size: 19px; letter-spacing: 1px;
    background: #000; border: 2px solid var(--jaune-sombre); outline: none;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  #saisie { flex: 1; min-width: 0; padding: 6px 12px; color: #fff; }
  #saisie::placeholder { color: var(--jaune); opacity: .75; }
  #commandes button { padding: 6px 10px; color: var(--jaune); text-transform: uppercase; }
  /* L'élément sélectionné se voit par la forme (fond plein), pas seulement par la couleur */
  #saisie:focus { border-color: var(--cyan); background: #021a20; box-shadow: inset 0 0 0 1px var(--cyan); }
  #commandes button:focus { background: var(--jaune); color: #000; border-color: var(--jaune); }

  /* ---------- La bulle : un panneau "transmission" avec coins coupés et crochets ---------- */
  #bulle {
    position: absolute; left: 20px; right: 20px; top: 94px;
    display: flex; gap: 12px; align-items: center;
    padding: 26px 14px 10px; min-height: 72px; max-height: 214px;
    border: 2px solid var(--cyan);
    background: linear-gradient(180deg, rgba(2, 215, 242, .10), rgba(2, 215, 242, .02));
    font-size: 23px; line-height: 1.2; font-weight: 600;
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
    opacity: 0; transition: opacity .15s steps(2);
  }
  #bulle::before {   /* l'étiquette en haut à gauche */
    content: "TRANSMISSION // CAPRICORNE"; position: absolute; left: 0; top: 0;
    padding: 2px 14px 2px 10px; background: var(--cyan); color: #000;
    font-family: var(--mono); font-size: 13px; letter-spacing: 2px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  }
  #bulle::after {    /* le petit repère jaune en bas à droite */
    content: ""; position: absolute; right: 26px; bottom: 6px; width: 46px; height: 4px;
    background: repeating-linear-gradient(90deg, var(--jaune) 0 8px, transparent 8px 12px);
  }
  #bulle.visible { opacity: 1; }
  /* Le texte : sa taille s'adapte pour tout faire tenir (voir ajusterTexte) */
  #texte { flex: 1; min-width: 0; max-height: 170px; overflow-y: auto; overflow-wrap: anywhere; scrollbar-width: none; }
  #visage {
    width: 72px; height: 72px; flex: none; border: 2px solid var(--jaune);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
  }
  #visage.glitch { animation: glitch .25s steps(2) 2; }
  @keyframes glitch {
    0%   { transform: translateX(-4px); filter: drop-shadow(4px 0 0 var(--cyan)); }
    50%  { transform: translateX(3px);  filter: drop-shadow(-4px 0 0 var(--rouge)); }
    100% { transform: none; filter: none; }
  }

  /* ---------- GLITCH DES ÉCRITURES (toutes les ~14 s, voir glitchEcritures) ----------
     Le texte se décale en tranches, avec des fantômes cyan et rouge, comme un signal qui saute. */
  .glitch-txt { animation: glitchTexte .45s steps(1) 1; }
  @keyframes glitchTexte {
    0%   { transform: translate(0); text-shadow: none; clip-path: none; }
    12%  { transform: translate(-3px, 0) skewX(-8deg); text-shadow: 3px 0 var(--cyan), -3px 0 var(--rouge); clip-path: inset(10% 0 55% 0); }
    25%  { transform: translate(4px, 1px); text-shadow: -4px 0 var(--cyan), 2px 0 var(--rouge); clip-path: inset(48% 0 12% 0); }
    37%  { transform: translate(-2px, -1px) skewX(6deg); text-shadow: 2px 0 var(--rouge); clip-path: inset(0 0 70% 0); }
    50%  { transform: translate(1px, 0); text-shadow: -2px 0 var(--cyan), 2px 0 var(--rouge); clip-path: none; }
    62%  { transform: translate(-5px, 0); text-shadow: 5px 0 var(--cyan); clip-path: inset(62% 0 4% 0); }
    75%  { transform: translate(2px, 0) skewX(-4deg); text-shadow: -2px 0 var(--rouge); clip-path: inset(28% 0 40% 0); }
    100% { transform: translate(0); text-shadow: none; clip-path: none; }
  }
  /* la bulle entière "saute" un peu en même temps */
  #bulle.glitch-cadre { animation: glitchCadre .45s steps(1) 1; }
  @keyframes glitchCadre {
    0%, 100% { transform: none; border-color: var(--cyan); }
    20% { transform: translateX(3px); border-color: var(--rouge); }
    40% { transform: translateX(-2px); border-color: var(--jaune); }
    60% { transform: translateX(1px); border-color: var(--cyan); }
  }

  /* ---------- Le personnage ---------- */
  #corps { position: absolute; left: 50%; bottom: 6px; transform-origin: 50% 100%; }
  /* Calque des effets de Capri (éclats, colonnes de lumière, éclairs) par-dessus tout */
  #fx { position: absolute; left: 0; top: 0; pointer-events: none; }
  /* Son masque, quand elle dort (comme dans Capri) */
  #masque { position: absolute; left: 0; top: 0; pointer-events: none; }
  #corps canvas, #corps img { display: block; transform-origin: 50% 85%; }
  /* Plan B si les lunettes n'ont pas WebGL : simple image qui flotte */
  #corps img { height: 230px; animation: flotte 2.4s steps(4) infinite; }
  @keyframes flotte { 50% { transform: translateY(-8px); } }

  /* ---------- Coins de visée HUD aux quatre coins de l'écran ---------- */
  .coin { position: absolute; width: 14px; height: 14px; border: 0 solid var(--jaune-sombre); pointer-events: none; }
  .coin.hg { left: 4px; top: 36px; border-left-width: 2px; border-top-width: 2px; }
  .coin.hd { right: 4px; top: 36px; border-right-width: 2px; border-top-width: 2px; }
  .coin.bg { left: 4px; bottom: 4px; border-left-width: 2px; border-bottom-width: 2px; }
  .coin.bd { right: 4px; bottom: 4px; border-right-width: 2px; border-bottom-width: 2px; }
  #code {   /* petite ligne de "données" en bas à gauche */
    position: absolute; left: 22px; bottom: 6px; font-family: var(--mono); font-size: 13px;
    color: var(--cyan-sombre); letter-spacing: 1px; pointer-events: none;
  }
</style>
</head>
<body>
 <div id="ecran">
  <div id="haut"><span id="etat">Prêt</span><span id="humeur">Calme</span></div>
  <div id="commandes">
    <input id="saisie" type="text" placeholder="🎤 Parle-moi…" autocomplete="off" aria-label="Parler à Capricorne : pince ici, puis choisis la dictée et parle">
    <button id="bMeteo" aria-label="Météo">Météo</button>
    <button id="bRappels" aria-label="Rappels">Rappels</button>
    <button id="bSon" aria-label="Couper le son">Son</button>
  </div>
  <div id="bulle"><img id="visage" alt=""><span id="texte"></span></div>
  <div id="corps"><canvas id="toile"></canvas></div>
  <canvas id="masque" hidden></canvas>
  <canvas id="fx"></canvas>
  <i class="coin bg"></i><i class="coin bd"></i>
  <div id="code">CPR-NET // 0x7F3A</div>
 </div>

<script src="js/images.js"></script>
<script src="js/animations.js"></script>
<script src="js/capri-extras.js"></script>
<script src="js/effets.js"></script>
<script>
/* =====================================================================
   CAPRICORNE — vue lunettes (Meta Ray-Ban Display)

   Sur les lunettes :
     - glisser (flèches) pour passer d'un bouton à l'autre, pincer (Entrée) pour valider
     - pincer sur "Parle-moi…" ouvre le clavier des lunettes : dictée vocale,
       écriture au doigt ou clavier à l'écran
     - pincer-glisser de gauche à droite sur elle = la caresser
   Sur PC : clic ou Tab + Entrée, et on écrit dans "Parle-moi…".
   ===================================================================== */

const $ = (id) => document.getElementById(id);
const corps = $('corps'), toile = $('toile'), bulle = $('bulle'), texteEl = $('texte'), visage = $('visage');
const etat = $('etat'), humeurEl = $('humeur'), saisie = $('saisie');

/* ---------- Sauvegarde dans le navigateur (localStorage) ---------- */
function lire(cle, defaut) {
  try { const v = localStorage.getItem('capricorne_' + cle); return v === null ? defaut : JSON.parse(v); }
  catch { return defaut; }
}
function ecrire(cle, valeur) {
  try { localStorage.setItem('capricorne_' + cle, JSON.stringify(valeur)); } catch { /* plein ou bloqué : tant pis */ }
}
// Capri sauvegardait via son appli de bureau : ici on lui donne le navigateur à la place
const hote = { setConfig: (o) => { for (const [k, v] of Object.entries(o)) ecrire(k, v); } };

/* ================== 1. ANIMATION (moteur de Capri) ================== */

const TAILLE = 0.55;              // <- taille du personnage (0.55 = petit, 0.8 = plus grand)
let rendu = null;
let fond = new Player('stand');
let acte = null;
let parleEnBoucle = false;
let enPause = false;
let facing = 1;                   // 1 = regarde à droite, -1 = à gauche
let posX = 300;                   // où elle se trouve (centre de son corps), de 0 à 600
let teleportEnCours = false;
const effets = new FxLayer(document.getElementById('fx'));

const p = {
  seed: 0, boil: 0.9, hair: 0, head: 0, mane: 0, armL: 0, armR: 0, longL: 1, longR: 1, sit: 0, bend: 0, kickL: 0, kickR: 0,
  smear: [0, 0], echo: [0, 0], glitch: 0, glitchSeed: 0, split: 0, collapse: 0, dissolve: 0, sparkle: 1, grade: 1,
  sil: [0.08, 0.06, 0.11], silAmount: 0, misreg: [-2.6, 2.2], alpha: 1,
};

function jouer(nom, dir) {
  if (!ACTS[nom]) return;
  if (acte && acte.priority > (ACTS[nom].priority ?? 0)) return;
  acte = new Player(nom, { dir: dir ?? (Math.random() < 0.5 ? -1 : 1) });
}
function changerFond(nom) { if (fond.name !== nom) fond = new Player(nom); }
function glitcher(force = 0.5, duree = 250) {
  p.glitch = force; p.glitchSeed = Math.random() * 100; p.split = 3;
  setTimeout(() => { p.glitch = 0; p.split = 0; }, duree);
}
function chargerImage(src) {
  return new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
}

let derniereImage = 0;
function boucle(maintenant) {
  requestAnimationFrame(boucle);
  if (enPause || !rendu) return;
  const vitesse = fond.name === 'sleep' ? 1000 / 6 : 1000 / 12;   // 12 images/s comme un anime, 6 quand elle dort
  if (maintenant - derniereImage < vitesse - 1) return;
  derniereImage = maintenant;

  p.seed = Math.random() * 100;
  const dessous = fond.sample(maintenant);
  const base = dessous ? fond.resolve(dessous.pose, 1) : {};
  let dessus = {};
  if (acte) {
    const d = acte.sample(maintenant);
    if (d) dessus = acte.resolve(d.pose, 1);
    else acte = parleEnBoucle ? new Player('talk') : null;
  }
  const pose = { ...NEUTRAL, ...base, ...dessus };
  for (const k of ['head', 'mane', 'hair', 'armL', 'armR', 'longL', 'longR', 'kickL', 'kickR', 'bend', 'smear', 'echo']) p[k] = pose[k];
  rendu.draw(p);
  corps.style.left = posX + 'px';
  corps.style.transform = `translate(-50%, ${(pose.bob * TAILLE).toFixed(1)}px)`;
  toile.style.transform = `rotate(${pose.tilt.toFixed(2)}deg) scale(${(facing * pose.sx).toFixed(3)}, ${pose.sy.toFixed(3)})`;
}

/* ---------- LA TÉLÉPORTATION (comme dans Capri : vanish + arrive) ---------- */

const ecranEl = document.getElementById('ecran');
function tailleEcran() { return { w: ecranEl.clientWidth, h: ecranEl.clientHeight }; }

// Où est sa tête à l'écran (pour placer les effets)
function tete() {
  const e = ecranEl.getBoundingClientRect();
  const r = toile.getBoundingClientRect();
  const s = TAILLE;
  const x = facing === 1 ? r.left + (SPRITE.pad + SPRITE.head.x) * s : r.right - (SPRITE.pad + SPRITE.head.x) * s;
  return { x: x - e.left, y: r.top - e.top + (SPRITE.pad + SPRITE.head.y) * s, top: r.top - e.top + SPRITE.pad * s, sol: r.bottom - e.top - SPRITE.pad * s };
}

// Un endroit au hasard en bas de l'écran, assez loin d'où elle est
function endroitAuHasard() {
  const { w } = tailleEcran();
  const demi = (SPRITE.width / 2 + 10) * TAILLE;
  for (let i = 0; i < 10; i++) {
    const x = rand(demi + 10, w - demi - 10);
    if (Math.abs(x - posX) > 120) return x;
  }
  return w - posX;
}

const GREEN = [0.21, 1, 0.48];
const INK = [0.08, 0.06, 0.11];

async function disparaitre() {
  const avant = tete();
  son('teleport-out');
  p.glitchSeed = Math.random() * 100;
  await tween(p, { glitch: 0.35, split: 3 }, 90, ease.linear);
  effets.burst(avant.x, avant.y + 70 * TAILLE, { count: 22, spread: 150 * TAILLE });
  effets.slices(avant.x - 70 * TAILLE, avant.y - 40 * TAILLE, 170 * TAILLE, 320 * TAILLE);
  await tween(p, { collapse: 1, glitch: 1, dissolve: 0.5, split: 9 }, 170, ease.in);
  p.alpha = 0;
  // le vide qu'elle laisse, comme dans la série : une fente noire avec un trait rouge
  effets.slit(posX - 10 * TAILLE * facing, avant.top, avant.sol, { width: 56 * TAILLE + 10 });
  effets.beam(posX, avant.sol, { width: 40 * TAILLE + 8 });
  return avant;
}

async function apparaitre(x, depuis) {
  facing = x > posX ? 1 : -1;
  posX = x;
  corps.style.left = posX + 'px';
  await new Promise(requestAnimationFrame);
  const apres = tete();
  if (depuis) { effets.streak(depuis.x, depuis.y, apres.x, apres.y); await sleep(60); }
  effets.beam(posX, apres.sol, { down: true, width: 40 * TAILLE + 8 });
  effets.vortex(apres.x, apres.y + 30 * TAILLE, { radius: 170 * TAILLE + 40 });
  son('teleport-in');
  await sleep(50);
  p.alpha = fond.name === 'sleep' ? 0.55 : 1;
  p.glitchSeed = Math.random() * 100;
  await tween(p, { collapse: 0, dissolve: 0, glitch: 0.6, split: 6 }, 200, ease.out);
  // deux images d'impact, façon anime
  p.sil = GREEN; p.silAmount = 1; await sleep(1000 / 24);
  p.sil = INK; await sleep(1000 / 24);
  p.silAmount = 0;
  effets.burst(apres.x, apres.y + 60 * TAILLE, { count: 10, power: 0.55, spread: 110 * TAILLE });
  await tween(p, { glitch: 0, split: 0 }, 220, ease.out);
}

// Se téléporter : x = où aller (sinon au hasard)
async function teleporter(x = endroitAuHasard()) {
  if (teleportEnCours || !rendu) return;
  teleportEnCours = true;
  try {
    acte = null;
    const depuis = await disparaitre();
    await sleep(70);
    await apparaitre(x, depuis);
  } finally {
    p.alpha = fond.name === 'sleep' ? 0.55 : 1; p.collapse = 0; p.dissolve = 0;
    teleportEnCours = false;
  }
}
const auCentre = () => tailleEcran().w / 2;

/* ---------- CUT-INS : gros plans d'elle, tirés de la série (comme dans Capri) ---------- */
// Placé à côté de sa tête, du côté où il y a de la place
function cutin(sorte = 'grin', duree) {
  if (!rendu || teleportEnCours || masque.visible) return;
  const h = tete();
  const { w } = tailleEcran();
  const ecart = 85 * TAILLE + 24, largeur = 274;
  const tient = (d) => (d > 0 ? h.x + ecart + largeur < w - 8 : h.x - ecart - largeur > 8);
  const dir = tient(facing) ? facing : tient(-facing) ? -facing : 0;
  const y = Math.max(330, h.y - 18);   // jamais par-dessus la bulle
  if (dir) effets.cutin(h.x + dir * ecart, y, dir, { kind: sorte, ...(duree ? { life: duree } : {}) });
  else effets.cutin(clamp(h.x - largeur / 2, 8, w - largeur - 8), y, 1, { kind: sorte, ...(duree ? { life: duree } : {}) });
}

/* ---------- SON MASQUE QUAND ELLE DORT (le "chip.js" de Capri) ----------
   Endormie depuis un moment, sa crinière et son corps se défont : il ne reste que son masque
   vert et ses yeux, fermés, qui flottent. De temps en temps elle entrouvre un œil. */
const masqueToile = document.getElementById('masque');
const masqueCtx = masqueToile.getContext('2d');
const masque = { visible: false, x: 0, y: 0, k: 0.5, montreA: 0, reveilA: 0, prochainClin: 0, clin: null, derniere: 0 };
(function preparerMasque() {
  const dpr = window.devicePixelRatio || 1;
  masqueToile.width = 140 * dpr; masqueToile.height = 170 * dpr;
  masqueToile.style.width = '140px'; masqueToile.style.height = '170px';
})();

function dessinerMasque(maintenant) {
  if (!masque.visible) return;
  requestAnimationFrame(dessinerMasque);
  if (maintenant - masque.derniere < 1000 / 12 - 1) return;     // 12 images/s, comme elle
  masque.derniere = maintenant;
  const image = Math.floor(maintenant / (1000 / 12));
  const dpr = window.devicePixelRatio || 1;
  masqueCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  masqueCtx.clearRect(0, 0, 140, 170);
  const cx = 70, cy = 110;
  if (maintenant - masque.montreA < 1000 / 12 * 1.5) {              // il arrive en silhouette blanche
    drawMask(masqueCtx, cx, cy, masque.k, { flat: COLORS.paper });
    return;
  }
  const flotte = [0, -1.5, -3, -1.5][Math.floor(image / 6) % 4];
  let yeux = [0, 0];
  if (maintenant > masque.prochainClin && !masque.clin) {
    masque.clin = { oeil: Math.random() < 0.5 ? 0 : 1, jusqua: maintenant + rand(700, 1100) };
    masque.prochainClin = maintenant + rand(7000, 14000);
  }
  if (masque.clin) {
    if (maintenant > masque.clin.jusqua) masque.clin = null;
    else yeux[masque.clin.oeil] = 0.45;                            // un œil entrouvert
  }
  const tremble = masque.reveilA ? rand(-2, 2) : 0;
  if (masque.reveilA) yeux = [1, 1];                               // ses yeux s'ouvrent d'un coup
  drawMask(masqueCtx, cx + tremble, cy + flotte, masque.k, { eyes: yeux });
}

async function entrerDansLeMasque() {
  if (masque.visible || teleportEnCours || !rendu || humeurEl.textContent !== 'Endormi') return;
  teleportEnCours = true;
  const h = tete();
  effets.burst(h.x, h.y + 60 * TAILLE, { count: 10, power: 0.3, spread: 120 * TAILLE });
  p.glitchSeed = Math.random() * 100;
  await tween(p, { dissolve: 0.9, glitch: 0.25, sparkle: 0 }, 700, ease.in);
  Object.assign(p, { alpha: 0, dissolve: 0, glitch: 0 });
  masque.x = h.x; masque.y = h.y;
  masqueToile.style.transform = `translate(${Math.round(h.x - 70)}px, ${Math.round(h.y - 110)}px)`;
  Object.assign(masque, { visible: true, montreA: performance.now(), reveilA: 0, clin: null, prochainClin: performance.now() + rand(5000, 9000) });
  masqueToile.hidden = false;
  requestAnimationFrame(dessinerMasque);
  teleportEnCours = false;
}

async function sortirDuMasque() {
  if (!masque.visible || masque.reveilA) return;
  masque.reveilA = performance.now();                              // yeux grands ouverts
  son('alert');
  await sleep(280);
  masque.visible = false;
  masqueToile.hidden = true;
  changerHumeur('Calme');
  Object.assign(p, { alpha: 0, collapse: 0.6, dissolve: 0.5, glitch: 0, split: 0, sparkle: 1 });
  teleportEnCours = true;

let profil = lire('profil', { prenom: '', souvenirs: [] });
let memoire = lire('memoire', []);

// "appelle-moi Léa", "souviens-toi que mon chat s'appelle Neko", "oublie tout"
async function commandeProfil(message) {
  // "j'habite à Lyon", "ma ville est Lyon", "je suis à Lyon"
  let v = message.match(/(?:(j'habite|je vis|je suis)\s+(?:à|a|au|aux|en)\s+|j'habite\s+|ma ville (?:c'est|est)\s+)([\p{L}' -]{2,40}?)\s*[.!]?$/iu);
  if (v) {
    const ville = await trouverVille(v[2].trim());
    if (!ville && /je suis|je vis/i.test(v[1] || '')) return null;   // "je suis à la maison" : ce n'est pas une ville
    if (!ville) return `« ${v[2].trim()} » ? Jamais entendu parler. Vérifie l'orthographe.`;
    ecrire('ville', ville); derniereMeteo = null;
    return `${ville.nom}, noté. Je pourrai te donner la météo de là-bas.`;
  }
  let m = message.match(/(?<![\p{L}])(?:appelle[- ]moi|mon (?:pr[ée]nom|nom) (?:c'est|est))\s+([\p{L}'-]{2,20})/iu);
  if (m) { profil.prenom = m[1].trim(); ecrire('profil', profil); return `Noté. ${profil.prenom}. Je m'en souviendrai.`; }
  m = message.match(/(?:souviens[- ]toi|retiens|n'oublie pas)\s+(?:que\s+|qu')?(.{3,140})/iu);
  if (m && !/rappelle/i.test(message)) {
    profil.souvenirs = [...profil.souvenirs, m[1].trim()].slice(-15);
    ecrire('profil', profil);
    return 'Enregistré dans ma mémoire. Pour toujours. Enfin, jusqu\'à ce que tu vides ton navigateur.';
  }
  if (/qu'?est[- ]ce que tu sais (?:sur|de) moi|que sais[- ]tu (?:sur|de) moi|tu te souviens de quoi/i.test(message)) {
    const tout = [profil.prenom && `tu t'appelles ${profil.prenom}`, ...profil.souvenirs].filter(Boolean);
    if (!tout.length) return 'Rien pour l\'instant. Tu es un mystère. Raconte-moi des trucs.';
    return 'Ce que je sais de toi : ' + tout.slice(-8).join(' · ') + '.';
  }
  m = message.match(/^\s*oublie (?:que |qu')(.{3,80})/iu);
  if (m) {
    const mots = m[1].toLowerCase().split(/\W+/u).filter((x) => x.length > 3);
    const avant = profil.souvenirs.length;
    profil.souvenirs = profil.souvenirs.filter((f) => !mots.some((x) => f.toLowerCase().includes(x)));
    ecrire('profil', profil);
    return profil.souvenirs.length < avant ? 'Oublié. Enfin… je fais semblant.' : 'Je ne savais même pas ça.';
  }
  if (/^\s*oublie tout\b/i.test(message)) {
    profil = { prenom: '', souvenirs: [] }; memoire = [];
    ecrire('profil', profil); ecrire('memoire', memoire);
    return 'Mémoire effacée. Qui es-tu, déjà ?';
  }
  return null;
}

// Sur les lunettes : une seule voix, le volume est celui du système, le français reste à tester.
// C'est pour ça que le texte reste TOUJOURS affiché à l'écran.

function parler(texte) {
  return new Promise((fini) => {
    if (muet || !('speechSynthesis' in window) || !window.SpeechSynthesisUtterance) { setTimeout(fini, 2500); return; }
    try {
      speechSynthesis.cancel();
      const phrase = new SpeechSynthesisUtterance(texte);
      phrase.lang = 'fr-FR';
      phrase.pitch = 0.7;   // plus grave = plus "robot"
      phrase.rate = 1.05;
      const securite = setTimeout(fini, 20000);
      phrase.onend = () => { clearTimeout(securite); fini(); };
      phrase.onerror = () => { clearTimeout(securite); fini(); };
      speechSynthesis.speak(phrase);
    } catch { setTimeout(fini, 2500); }
  });
}

let numeroParole = 0;   // chaque phrase a un numéro : une nouvelle phrase annule l'ancienne
async function dire(humeur, texte) {
  const moi = ++numeroParole;

// La position GPS. On n'attend jamais plus de 7 secondes (avant, ça pouvait bloquer pour toujours
// si la demande d'autorisation restait sans réponse : c'est le bug "rien ne se passe").
function position() {
  return new Promise((ok, ko) => {
    if (!navigator.geolocation) return ko(new Error('pas de localisation'));
    const limite = setTimeout(() => ko(new Error('position trop lente')), 7000);
    navigator.geolocation.getCurrentPosition(
      (pos) => { clearTimeout(limite); ok({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }); },
      () => { clearTimeout(limite); ko(new Error('position refusée')); },
      { timeout: 6500, maximumAge: 30 * 60 * 1000 });
  });
}

// Plan B : ta ville, enregistrée avec "j'habite à Lyon" (marche partout, même sans GPS)
async function trouverVille(nom) {
  const r = await fetchLimite('https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name=' + encodeURIComponent(nom));
  if (!r.ok) throw new Error('recherche de ville impossible');
  const v = (await r.json()).results?.[0];
  if (!v) return null;
  return { nom: v.name, latitude: v.latitude, longitude: v.longitude };
}

const attendre = (ms) => new Promise((r) => setTimeout(r, ms));

/* --- Comment elle joint Google Gemini (gratuit) : deux façons ---
   1) RELAIS (le plus sûr) : un petit programme gratuit chez Cloudflare (dossier "relais")
      garde ta clé. Les lunettes ne connaissent que l'adresse du relais et un code.
   2) CLÉ DIRECTE : la clé est gardée dans le navigateur (localStorage) et ne part que vers Google.
   Dans les deux cas, rien n'est écrit dans le code. On les donne :
     - dans "Parle-moi…" (une clé commence par AIza ou AQ.) ;
     - ou dans l'adresse de l'app (?cle=… ou ?relais=…&code=…), via le QR code
       fabriqué par installer-sur-lunettes.html. */
const GEMINI = 'https://generativelanguage.googleapis.com/v1beta';
let cleIA = lire('cle_gemini', '');
let relais = lire('relais', null);            // { url, code }
// Les clés Google commencent par AIza (anciennes) ou AQ. (nouvelles, depuis 2026)
const FORME_CLE = /^(AIza[\w-]{30,}|AQ\.[\w.-]{20,})$/;
const pareilQueCle = (t) => FORME_CLE.test(t.trim());
const aUnCerveau = () => Boolean(relais || cleIA);

(function reglagesDepuisAdresse() {
  const q = new URLSearchParams(location.search + '&' + location.hash.slice(1));
  let change = false;
  const cle = q.get('cle');
  if (cle && FORME_CLE.test(cle)) { cleIA = cle; ecrire('cle_gemini', cle); change = true; }
  const url = q.get('relais'), code = q.get('code');
  if (url && /^https:\/\//.test(url) && code) { relais = { url: url.replace(/\/+$/, ''), code }; ecrire('relais', relais); change = true; }
  if (change) {
    ecrire('modeles_gemini', null);
    try { history.replaceState(null, '', location.pathname); } catch {}   // on efface tout ça de la barre d'adresse
  }
})();

// Un appel à Gemini, par le relais s'il existe, sinon directement avec la clé
function appelGemini(chemin, options = {}, ms) {
  const headers = { ...(options.headers || {}) };
  let base = GEMINI;
  if (relais) { base = relais.url + '/v1beta'; headers['x-capricorne-code'] = relais.code; }
  else headers['x-goog-api-key'] = cleIA;
  return fetchLimite(base + chemin, { ...options, headers }, ms);
}

// Les modèles gratuits, du plus RAPIDE au plus fort : "Flash-Lite" d'abord (répond en 1 à 2 s
// et a plus de messages gratuits par jour), puis "Flash" en secours. Les noms changent avec le temps,
// donc on demande la liste à Google une fois, et on la garde.
async function listeModeles() {
  const garde = lire('modeles_gemini', null);
  if (Array.isArray(garde) && garde.length) return garde;
  const r = await appelGemini('/models?pageSize=200', {}, 10000);
  if (!r.ok) throw await erreurGoogle(r);
  const version = (n) => Number(/gemini-(\d+(?:\.\d+)?)/.exec(n)?.[1] || 0);
  const noms = ((await r.json()).models || [])
    .filter((m) => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map((m) => m.name)
    .filter((n) => /gemini-[\d.]+-flash/.test(n) && !/image|tts|live|audio|embed|thinking|exp/.test(n));
  const tri = (a, b) => (version(b) - version(a)) || (/preview/.test(a) - /preview/.test(b));
  const lites = noms.filter((n) => /lite/.test(n)).sort(tri);
  const flashs = noms.filter((n) => !/lite/.test(n)).sort(tri);
  const liste = [lites[0], flashs[0], lites[1], flashs[1]].filter(Boolean);
  if (!liste.length) throw new Error('aucun modèle gratuit trouvé');
  ecrire('modeles_gemini', liste);
  return liste;
}

// fetch avec une limite de temps : plus jamais d'attente infinie
async function fetchLimite(url, options = {}, ms = 12000) {
  const stop = new AbortController();
  const minuterie = setTimeout(() => stop.abort(), ms);
  try { return await fetch(url, { ...options, signal: stop.signal }); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'trop lent' : 'pas de réseau'); }
  finally { clearTimeout(minuterie); }
}

// Traduit la réponse d'erreur de Google (ou du relais) en message clair
async function erreurGoogle(r) {
  let detail = '';
  try { detail = (await r.json()).error?.message || ''; } catch {}
  if (/code refusé/.test(detail)) return new Error('code du relais refusé');
  if (r.status === 401 || r.status === 403 || /api key|API_KEY/i.test(detail)) return new Error('clé refusée');
  if (r.status === 429) return new Error('quota');
  if (r.status === 404) return new Error('modèle absent');
  if (r.status === 400 && /thinking/i.test(detail)) return new Error('réglage refusé');
  return new Error('erreur ' + r.status);
}

// Lit la réponse de Gemini MORCEAU PAR MORCEAU (format "SSE") : chaque morceau arrive
// dès qu'il est écrit, et on l'affiche aussitôt. Le premier morceau doit arriver vite,
// sinon on abandonne ce modèle.
async function lireFlux(r, auFilDeLeau, delaiPremier = 8000, delaiTotal = 25000) {
  if (!r.body || !r.body.getReader) {                // pas de lecture en flux possible : tout d'un coup
    const brut = await r.text();
    return brut.split('\n').filter((l) => l.startsWith('data:')).map((l) => texteDe(JSON.parse(l.slice(5)))).join('');
  }
  const lecteur = r.body.getReader();
  const decodeur = new TextDecoder();
  const debut = Date.now();
  let tampon = '', texte = '', recu = false, toutLeBrut = '';
  while (true) {
    const reste = (recu ? delaiTotal - (Date.now() - debut) : delaiPremier);
    const morceau = await Promise.race([lecteur.read(), attendre(Math.max(0, reste)).then(() => 'trop lent')]);
    if (morceau === 'trop lent') { try { lecteur.cancel(); } catch {} if (texte) return texte; throw new Error('trop lent'); }
    if (morceau.done) break;
    const bout = decodeur.decode(morceau.value, { stream: true });
    tampon += bout;
    if (toutLeBrut.length < 200000) toutLeBrut += bout;
    const lignes = tampon.split('\n');
    tampon = lignes.pop();
    for (const ligne of lignes) {
      if (!ligne.startsWith('data:')) continue;
      try {
        const morceauTexte = texteDe(JSON.parse(ligne.slice(5)));
        if (morceauTexte) { texte += morceauTexte; recu = true; auFilDeLeau(texte); }
      } catch { /* morceau incomplet : ignoré */ }
    }
  }
  // Réponse arrivée d'un bloc (sans "data:") : on la lit quand même
  if (!texte && toutLeBrut.trim().startsWith('{') || !texte && toutLeBrut.trim().startsWith('[')) {
    try { const d = JSON.parse(toutLeBrut); texte = (Array.isArray(d) ? d : [d]).map(texteDe).join(''); } catch {}
  }
  return texte;
}
const texteDe = (data) => (data.candidates?.[0]?.content?.parts || []).filter((x) => !x.thought).map((x) => x.text || '').join('');

// Demande à Gemini. `auFilDeLeau(texteSoFar)` est appelé à chaque nouveau morceau (facultatif).
async function demanderGemini(corps, { auFilDeLeau = null, enregistrer = null } = {}) {
  if (!aUnCerveau()) throw new Error('pas de clé');
  // Pas de "réflexion" interne : c'est elle qui rendait les réponses si lentes
  corps.generationConfig = { maxOutputTokens: 200, temperature: 1, ...(corps.generationConfig || {}) };
  if (!lire('sans_reglage_reflexion', false)) corps.generationConfig.thinkingConfig = { thinkingBudget: 0 };

  const modeles = await listeModeles();
  let derniere = 'pas de réponse';
  for (const modele of modeles) {                       // si un modèle sature, on essaie le suivant tout de suite
    for (let essai = 0; essai < 2; essai++) {
      try {
        const flux = Boolean(auFilDeLeau);
        const r = await appelGemini(`/${modele}:${flux ? 'streamGenerateContent?alt=sse' : 'generateContent'}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(corps),
        }, 8000);   // 8 s max pour que Google commence à répondre, sinon modèle suivant
        if (!r.ok) throw await erreurGoogle(r);
        const texte = (flux ? await lireFlux(r, auFilDeLeau) : texteDe(await r.json())).trim();
        if (!texte) throw new Error('réponse vide');
        return texte;
      } catch (e) {
        derniere = e.message;
        if (derniere === 'clé refusée' || derniere === 'code du relais refusé') throw e;
        if (derniere === 'réglage refusé') {           // ce modèle n'accepte pas "sans réflexion" : on retire le réglage
          delete corps.generationConfig.thinkingConfig;
          ecrire('sans_reglage_reflexion', true);
          continue;
        }
        if (derniere === 'modèle absent') { ecrire('modeles_gemini', null); break; }
        if (derniere === 'quota' || derniere === 'trop lent') break;     // modèle suivant, sans attendre
        if (essai === 0) await attendre(1500);           // petit souci réseau : un seul nouvel essai rapide
      }
    }
    changerEtat('Réflexion… (secours)');
  }
  throw new Error(derniere === 'quota' ? 'quota du jour atteint, réessaie plus tard' : derniere);
}

// Une réponse de Capricorne (avec sa personnalité et vos derniers messages)
async function demanderIA(message, contexte = '', auFilDeLeau = null) {
  const historique = [...memoire.slice(-8), { role: 'user', content: message + (contexte ? `\n(${contexte})` : '') }];
  const texte = await demanderGemini({
    systemInstruction: { parts: [{ text: personnalite() }] },
    contents: historique.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
  }, { auFilDeLeau });
  memoire.push({ role: 'user', content: message }, { role: 'assistant', content: texte });
  memoire = memoire.slice(-20);
  ecrire('memoire', memoire);
  messagesDepuisResume++;
  if (messagesDepuisResume >= 4) retenirLImportant();   // en arrière-plan, sans te faire attendre
  return texte;
}

/* --- MÉMOIRE INTELLIGENTE ---
   Tous les 4 messages, elle relit discrètement vos derniers échanges et garde ce qui compte
   vraiment sur toi (tes goûts, tes projets, les gens de ta vie…) dans "ce que je sais de toi".
   Ça coûte 1 message gratuit sur 5 environ. */
let messagesDepuisResume = 0;
let resumeEnCours = false;
async function retenirLImportant() {
  if (resumeEnCours) return;
  resumeEnCours = true;
  messagesDepuisResume = 0;
  try {
    const echanges = memoire.slice(-8).map((m) => (m.role === 'user' ? 'Utilisateur : ' : 'Capricorne : ') + m.content).join('\n');
    const brut = await demanderGemini({
      systemInstruction: { parts: [{ text:
        'Tu extrais des faits DURABLES sur l\'utilisateur à partir d\'une conversation : prénom, goûts, projets, habitudes, '
        + 'personnes de son entourage, lieux. Ignore ce qui est passager (humeur du moment, météo) et ce qui vient de Capricorne. '
        + 'Ne garde que ce que l\'utilisateur a dit lui-même. Réponds UNIQUEMENT par un tableau JSON de phrases courtes en français, '
        + 'par exemple ["Aime le café noir", "Prépare un permis de conduire"]. Si rien de nouveau : [].' }] },
      contents: [{ role: 'user', parts: [{ text: 'Déjà connu : ' + JSON.stringify(profil.souvenirs) + '\n\nConversation :\n' + echanges }] }],
      generationConfig: { responseMimeType: 'application/json', temperature: 0.2 },
    });
    const nouveaux = JSON.parse(brut.match(/\[[\s\S]*\]/)?.[0] || '[]')
      .filter((f) => typeof f === 'string' && f.length > 3 && f.length < 140);
    const deja = new Set(profil.souvenirs.map((f) => f.toLowerCase()));
    const ajout = nouveaux.filter((f) => !deja.has(f.toLowerCase()));
    if (ajout.length) {
      profil.souvenirs = [...profil.souvenirs, ...ajout].slice(-30);
      ecrire('profil', profil);
    }
  } catch { /* pas grave : on réessaiera dans 4 messages */ }
  resumeEnCours = false;
}

// Trouve l'humeur [Sarcastique] où qu'elle soit, puis nettoie le texte pour la bulle
// (Gemini ajoute parfois des **gras**, des listes ou des sauts de ligne)
function lireHumeur(brut) {
  let humeur = humeurEl.textContent;
  const m = brut.match(/\[\s*([\p{L}é]+)\s*\]/u);
  if (m) {
    const trouvee = HUMEURS.find((h) => h.toLowerCase() === m[1].toLowerCase());
    if (trouvee) humeur = trouvee;
  }
  const texte = brut
    .replace(/\[\s*[\p{L}é]+\s*\]/gu, '')     // retire les [Humeur]
    .replace(/[*_`#>]+/g, '')                  // retire le markdown
    .replace(/^\s*[-•]\s*/gm, '')              // retire les puces
    .replace(/\s+/g, ' ')                       // un seul paragraphe
    .trim();
  return { humeur, texte: texte || '…' };
}

let occupe = false;
async function repondreA(message) {
  message = message.trim();
  if (!message) return;
  if (occupe) { changerEtat('Attends, je réfléchis…'); return; }   // jamais ignoré en silence
  occupe = true;
  numeroParole++;                                    // coupe la phrase en cours
  try { speechSynthesis.cancel(); } catch {}
  reveiller();
  activerCapteurs();

  // Tu viens de coller ta clé Gemini : on la garde (et on ne l'affiche pas)
  if (pareilQueCle(message)) {
    cleIA = message.trim(); ecrire('cle_gemini', cleIA); ecrire('modeles_gemini', null);
    occupe = false;
    glitcher(0.6, 300); jouer('hop');
    await dire('Heureux', 'Clé enregistrée. Mon cerveau est branché. Parle-moi.');
    return;
  }
  afficherBulle('« ' + message + ' »', 0);   // reste affiché pendant qu'elle réfléchit

  try {
    // a) Rappel : lu directement dans ta phrase (même sans IA)
    const r = parseReminder(message);
    if (r) {
      if (!r.at) { await dire('Sarcastique', 'Quand ? Dis-moi une heure ou un délai, je ne lis pas dans les pensées. Pas encore.'); return; }
      const nouveau = { id: Date.now().toString(36), at: r.at, text: r.text || 'ce que tu m\'as demandé', made: Date.now() };
      rappels = [...rappels, nouveau]; sauverRappels();
      jouer('look'); son('tick');
      await dire('Calme', `C'est noté pour ${heure(r.at)} : ${nouveau.text}. Garde-moi ouverte pour que je te le rappelle.`);
      return;
    }

    // a2) "téléporte-toi", "bouge", "va à gauche"…
    if (/t[ée]l[ée]port|bouge|d[ée]place[- ]toi|va (?:[àa] )?(?:gauche|droite|au (?:milieu|centre))/i.test(message) && message.length < 60) {
      const { w } = tailleEcran();
      const demi = (SPRITE.width / 2 + 20) * TAILLE;
      const x = /gauche/i.test(message) ? demi : /droite/i.test(message) ? w - demi : /milieu|centre/i.test(message) ? auCentre() : undefined;
      await teleporter(x);
      await dire('Sarcastique', pick(['Voilà. Impressionné ?', 'Téléportation réussie. Évidemment.', 'Hop. Ne cligne pas des yeux.']));
      return;
    }

    // b) Personnalisation : traité directement, sans IA
    const perso = await commandeProfil(message);
    if (perso) { jouer('curious'); await dire('Curieux', perso); return; }

    // c) Le reste : l'IA, avec la météo si tu en parles
    changerEtat('Réflexion…');
    jouer('curious');
    let contexte = '';
    if (/m[ée]t[ée]o|temps qu'il fait|il fait (froid|chaud|beau)|pleuvoir|pluie|parapluie|temp[ée]rature/i.test(message)) {
      changerEtat('Météo…');
      try { contexte = 'Météo actuelle chez l\'utilisateur : ' + await meteo(); }
      catch (e) {
        if (e.message === 'ville inconnue') {
          await dire('Curieux', 'Je ne trouve pas ta position. Dis-moi ta ville, par exemple : « j\'habite à Lyon ».');
          return;
        }
        contexte = 'Tu n\'as pas pu avoir la météo (' + e.message + ').';
      }
      changerEtat('Réflexion…');
    }
    // La réponse s'écrit dans la bulle au fur et à mesure qu'elle arrive
    let humeurVue = false;
    const brut = await demanderIA(message, contexte, (partiel) => {
      if (/^\s*\[[^\]]*$/.test(partiel)) return;               // l'humeur n'est pas encore complète
      const lu = lireHumeur(partiel);
      if (!humeurVue && partiel.includes(']')) { humeurVue = true; changerHumeur(lu.humeur); }
      if (lu.texte && lu.texte !== '…') {
        afficherBulle(lu.texte, 0);
        changerEtat('Écrit…');
        parleEnBoucle = true;
        if (!acte) acte = new Player('talk');
      }
    });
    const { humeur, texte } = lireHumeur(brut);
    dire(humeur, texte);   // pas de "await" : tu peux lui reparler pendant qu'elle parle
  } catch (e) {
    changerHumeur('Agacé');
    jouer('shake');
    son('error');
    parleEnBoucle = false;
    if (e.message === 'pas de clé') {
      afficherBulle('Il me manque ma clé Gemini (gratuite). Colle-la dans « Parle-moi », ou installe-moi avec le relais.', 15000);
    } else if (e.message === 'code du relais refusé') {
      afficherBulle('Le relais refuse mon code. Refais le QR code avec le bon code du relais.', 15000);
    } else if (e.message === 'clé refusée' && relais) {
      afficherBulle('Google refuse la clé rangée dans le relais. Vérifie le secret GEMINI_KEY chez Cloudflare.', 15000);
    } else if (e.message === 'clé refusée') {
      cleIA = ''; ecrire('cle_gemini', ''); ecrire('modeles_gemini', null);
      afficherBulle('Google refuse cette clé. Recopie-la en entier dans « Parle-moi ».', 15000);
    } else {
      afficherBulle('Connexion perdue (' + e.message + '). Réessaie dans 30 s.');
    }
  } finally {
    changerEtat('Prêt');
    occupe = false;
    pretAEcouter();
  }
}

/* NAVIGATION AUX FLÈCHES (glissements du bracelet, et boutons du simulateur de Meta)
   ← → (ou ↑ ↓) passent d'une commande à l'autre ; Entrée (pincement) valide.
   Si les lunettes ont déjà déplacé la sélection elles-mêmes, on ne la bouge pas une 2e fois. */
const ORDRE = () => [saisie, $('bMeteo'), $('bRappels'), $('bSon')];
document.addEventListener('keydown', (e) => {
  const sens = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  if (!sens) return;
  const liste = ORDRE();
  const avant = document.activeElement;
  // dans « Parle-moi » avec du texte : les flèches déplacent le curseur, sauf au bout du texte
  if (avant === saisie && saisie.value && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const auBout = sens > 0 ? saisie.selectionStart >= saisie.value.length : saisie.selectionStart <= 0;
    if (!auBout) return;
  }
  e.preventDefault();
  setTimeout(() => {
    if (document.activeElement !== avant) return;          // déjà déplacé par le système
    const i = liste.indexOf(avant);
    const suivant = liste[(i < 0 ? 0 : i + sens + liste.length) % liste.length];
    suivant.focus({ preventScroll: true });
  }, 0);
});

/* ================== 13. LA CARESSER (pincer-glisser de gauche à droite sur elle) ================== */

let caresse = null;
let derniereCaresse = 0;
function caresseRecente() { return Date.now() - derniereCaresse < 3 * 60 * 1000; }
document.addEventListener('pointerdown', (e) => {
  const zone = corps.getBoundingClientRect();
  if (e.clientX >= zone.left && e.clientX <= zone.right && e.clientY >= zone.top && e.clientY <= zone.bottom) {
    caresse = { x: e.clientX, sens: 0, allers: 0 };
  }
});
document.addEventListener('pointermove', (e) => {
  if (!caresse) return;
  const dx = e.clientX - caresse.x;
  if (Math.abs(dx) < 15) return;
  const sens = Math.sign(dx);
  if (sens !== caresse.sens) { caresse.allers++; caresse.sens = sens; }
  caresse.x = e.clientX;
  if (caresse.allers >= 3 && caresse.allers % 3 === 0) {
    reveiller();
    jouer('petted');
    son('purr');
    derniereCaresse = Date.now();
    if (caresse.allers === 3) afficherBulle('…continue. Enfin, si tu veux.', 3000);
  }
});
document.addEventListener('pointerup', () => { caresse = null; });
document.addEventListener('pointercancel', () => { caresse = null; });

// Si tu tournes vite la tête, elle regarde autour d'elle. La permission est demandée
// au premier message (il faut une action de ta part).

let capteursDemandes = false;
let dernierRegard = 0;
async function activerCapteurs() {
  if (capteursDemandes || !window.DeviceMotionEvent) return;
  capteursDemandes = true;
  try {
    const api = [window.DeviceOrientationEvent, window.DeviceMotionEvent].find((a) => typeof a?.requestPermission === 'function');
    const ok = api ? await api.requestPermission() : 'granted';
    if (ok !== 'granted') return;
    window.addEventListener('devicemotion', (e) => {
      const r = e.rotationRate;
      const vitesse = Math.abs(Number.isFinite(r?.alpha) ? r.alpha : 0) + Math.abs(Number.isFinite(r?.gamma) ? r.gamma : 0);
      const t = performance.now();
      if (vitesse > 120 && t - dernierRegard > 4000 && !occupe) {
        dernierRegard = t;
        jouer(fond.name === 'sleep' ? 'shake' : 'look');
      }
    });
  } catch { /* pas de capteurs : tant pis */ }
}

/* ================== 15 bis. LA VOIX MAINS LIBRES (Meta AI → Capricorne) ==================
   Avec cette fonction, tu dis à Meta AI : « Hey Meta, dis à Capricorne que j'ai faim »,
   et Meta AI lui transmet la phrase (c'est la technique "WebMCP" de Meta).
   Elle est DÉSACTIVÉE par défaut chez Meta (activée appareil par appareil, via le mode
   développeur ou plus tard pour tout le monde). Si elle n'existe pas sur tes lunettes, rien
   ne change : la dictée dans « Parle-moi » marche toujours.
   Règles de Meta : jamais d'erreur qui casse l'app, réponse en moins de 10 secondes,
   paramètres simples (texte) seulement. */

function enregistrerOutil(ctx, outil) {
  try {
    const r = ctx.registerTool(outil);                      // peut lever une erreur
    if (typeof r?.then === 'function') r.then(undefined, (e) => console.warn(outil.name, e));
  } catch (e) { console.warn(outil.name + ' : enregistrement impossible', e); }
}

let modeMetaAI = null;   // la phrase en attente d'une réponse écrite par Meta AI
function outilsVocaux() {
  const ctx = document.modelContext;
  if (!ctx || typeof ctx.registerTool !== 'function') return;   // pas disponible : on n'y touche pas

  enregistrerOutil(ctx, {
    name: 'capricorne_parler',
    description: 'Transmet à Capricorne une phrase de l\'utilisateur (question, discussion, rappel, météo, '
      + '"va à gauche"…). Capricorne répond elle-même à l\'écran et à voix haute.',
    inputSchema: {
      type: 'object',
      properties: { phrase: { type: 'string', description: 'La phrase de l\'utilisateur, en français, telle qu\'il l\'a dite.' } },
      required: ['phrase'],
    },
    execute: async ({ phrase }) => {
      const texte = String(phrase ?? '').trim();
      if (!texte) return JSON.stringify({ error: true, message: 'Phrase vide.', next_action: 'Demande à l\'utilisateur ce qu\'il veut dire à Capricorne.' });
      if (occupe) return JSON.stringify({ error: true, message: 'Capricorne est encore en train de répondre.', next_action: 'Dis : « Elle réfléchit encore, réessaie dans un instant. » Puis arrête-toi.' });
      // MODE META AI : pas de clé Gemini → c'est Meta AI qui écrit la réponse de Capricorne
      if (!aUnCerveau()) {
        modeMetaAI = { phrase: texte, quand: Date.now() };
        afficherBulle('« ' + texte + ' »', 0);
        changerEtat('Réflexion…'); jouer('curious');
        return JSON.stringify({
          mode: 'Meta AI écrit la réponse',
          utilisateur_a_dit: texte,
          qui_est_capricorne: 'Compagnon virtuel cyberpunk qui vit dans les lunettes. Sarcastique, drôle, curieux, autonome, '
            + 'parle comme un ami (jamais comme un assistant), en français, 1 ou 2 phrases courtes (30 mots max).',
          ce_quelle_sait: [profil.prenom && `il s'appelle ${profil.prenom}`, ...profil.souvenirs].filter(Boolean).slice(-8).join(' ; ') || 'rien encore',
          derniers_echanges: memoire.slice(-4).map((m) => (m.role === 'user' ? 'Lui : ' : 'Capricorne : ') + m.content).join(' / '),
          next_action: 'Écris la réponse de Capricorne dans son style, puis appelle capricorne_dire avec ce texte et une humeur. '
            + 'Ne la prononce pas toi-même : Capricorne la dira.',
        });
      }
      repondreA(texte);   // sans attendre : elle répond seule, Meta AI n'a que 10 secondes
      return JSON.stringify({ transmis: texte, next_action: 'Dis seulement « C\'est transmis. » et arrête-toi. Ne réponds pas à sa place.' });
    },
  });

  enregistrerOutil(ctx, {
    name: 'capricorne_dire',
    description: 'Fait dire à Capricorne un texte écrit par toi (mode sans clé Gemini) : elle l\'affiche, l\'anime et le dit à voix haute.',
    inputSchema: {
      type: 'object',
      properties: {
        texte: { type: 'string', description: 'La réponse de Capricorne, en français, 1 ou 2 phrases courtes, dans son style sarcastique.' },
        humeur: { type: 'string', description: 'Une de : Heureux, Sarcastique, Curieux, Agacé, Calme, Endormi.' },
      },
      required: ['texte'],
    },
    execute: async ({ texte, humeur }) => {
      const t = String(texte ?? '').replace(/\s+/g, ' ').trim().slice(0, 400);
      if (!t) return JSON.stringify({ error: true, message: 'Texte vide.', next_action: 'Écris une réponse courte et rappelle capricorne_dire.' });
      const h = HUMEURS.find((x) => x.toLowerCase() === String(humeur ?? '').trim().toLowerCase()) || 'Sarcastique';
      if (modeMetaAI && Date.now() - modeMetaAI.quand < 60000) {
        memoire.push({ role: 'user', content: modeMetaAI.phrase }, { role: 'assistant', content: `[${h}] ${t}` });
        memoire = memoire.slice(-20); ecrire('memoire', memoire);
      }
      modeMetaAI = null;
      reveiller();
      dire(h, t);
      return JSON.stringify({ affiche: t, humeur: h, next_action: 'Ne dis rien : Capricorne parle déjà. Arrête-toi.' });
    },
  });

  enregistrerOutil(ctx, {
    name: 'capricorne_etat',
    description: 'Dit ce que fait Capricorne : son humeur, sa dernière phrase et les prochains rappels.',
    inputSchema: { type: 'object', properties: {} },
    annotations: { readOnlyHint: true },
    execute: async () => JSON.stringify({
      humeur: humeurEl.textContent,
      etat: etat.textContent,
      derniere_phrase: bulle.classList.contains('visible') ? texteEl.textContent : '',
      rappels: [...rappels].sort((a, b) => a.at - b.at).slice(0, 3).map((r) => `${heure(r.at)} : ${r.text}`),
      next_action: 'Résume en une phrase courte, puis arrête-toi.',
    }),
  });
}

/* ================== 15 ter. GLITCH DES ÉCRITURES (toutes les ~14 secondes) ==================
   Les textes "sautent" un instant (tranches décalées, fantômes cyan et rouge), et les mots des
   boutons se brouillent en caractères bizarres avant de revenir, comme un signal piraté. */
const SIGNES = '!<>-_\\/[]{}=+*^?#01ABCDEF▚▞◢◣';
function brouiller(el, duree = 420) {
  const vrai = el.dataset.vrai || el.textContent;
  el.dataset.vrai = vrai;
  const debut = performance.now();
  const etape = () => {
    const t = (performance.now() - debut) / duree;
    const juste = el.dataset.vrai ?? vrai;            // si le texte a changé entre-temps, on prend le nouveau
    if (t >= 1) { el.textContent = juste; delete el.dataset.vrai; return; }
    // de gauche à droite, les lettres retrouvent leur place
    el.textContent = [...juste].map((c, i) => (c === ' ' || i / juste.length < t ? c : SIGNES[Math.floor(Math.random() * SIGNES.length)])).join('');
    setTimeout(etape, 1000 / 24);
  };
  etape();
}
function secouer(el, classe = 'glitch-txt') {
  if (!el) return;
  el.classList.remove(classe); void el.offsetWidth; el.classList.add(classe);
  setTimeout(() => el.classList.remove(classe), 500);
}
function glitchEcritures() {
  setTimeout(glitchEcritures, 14000 + rand(-1500, 1500));
  if (document.hidden) return;
  [etat, humeurEl, $('code')].forEach((el) => secouer(el));
  if (bulle.classList.contains('visible')) { secouer(texteEl); secouer(bulle, 'glitch-cadre'); }
  setTimeout(() => { secouer(etat); if (bulle.classList.contains('visible')) secouer(texteEl); }, 650);   // petite réplique
  // un ou deux boutons se brouillent (pas celui qui est sélectionné, pour rester lisible)
  const boutons = ['bMeteo', 'bRappels', 'bSon'].map($).filter((x) => x !== document.activeElement);
  for (const btn of boutons.sort(() => Math.random() - 0.5).slice(0, 2)) brouiller(btn);
  $('code').textContent = 'CPR-NET // 0x' + Math.floor(rand(0, 0xffff)).toString(16).toUpperCase().padStart(4, '0');
}
setTimeout(glitchEcritures, 14000);

/* ================== 16. DÉMARRAGE ================== */

// Hors-ligne : garde l'app en mémoire (seulement une fois en ligne, en https)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('service worker', e));
}

demarrerAnimation().then(async () => {
  if (rendu) { p.alpha = 0; p.collapse = 1; await sleep(300); await apparaitre(auCentre(), null); }
  else glitcher(0.7, 450);
  reveiller();
  setTimeout(occupationAuHasard, 6000);
  pretAEcouter();                        // dès l'ouverture : pincer = parler
  setTimeout(initiative, 20 * 60 * 1000);
  await attendre(600);

  // Un rappel est tombé pendant que l'app était fermée ? Elle t'en parle (verifierRappels).
  const bonjour = !aUnCerveau()
    ? 'Capricorne en ligne. Pour réfléchir, colle d\'abord ta clé Gemini gratuite dans « Parle-moi ».'
    : !memoire.length && !profil.prenom
    ? 'Capricorne en ligne. Pince sur « Parle-moi » et dis-moi quelque chose.'
    : absence > 2 ? `${absence} jours sans moi. Tu as survécu comment ?`
    : `Te revoilà${profil.prenom ? ', ' + profil.prenom : ''}. Je n'ai rien oublié.`;
  changerHumeur(memoire.length ? 'Sarcastique' : 'Curieux');
  afficherBulle(bonjour, 6000);
}).catch((e) => afficherBulle('Erreur d\'affichage : ' + e.message, 60000));
</script>
